version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: iccmaker-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: iccmaker-api
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/.env:/app/apps/api/.env
      - ./apps/canticos:/app/apps/canticos
    environment:
      - MONGO_URI=mongodb://mongodb:27017/iccmaker
    depends_on:
      - mongodb
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: iccmaker-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:
